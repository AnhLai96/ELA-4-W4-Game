<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Voyage – Grade 4 Week 4</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#2a3b5c;--sun:#ffc93c;--green:#c8f3cf}*{box-sizing:border-box;font-family:Fredoka,'Trebuchet MS',sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(#d6efff 50%,#bfe8a8);color:var(--ink);display:flex;flex-direction:column}header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;flex-wrap:wrap}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;text-align:center;gap:15px}h1{font-size:clamp(22px,4vw,44px);margin:0}h2{font-size:clamp(25px,4vw,48px);margin:8px}.b{background:var(--sun);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);color:var(--ink);font-size:clamp(18px,2.5vw,30px);padding:12px 18px;cursor:pointer;min-height:55px;font-weight:700}.b:focus-visible{outline:5px solid #e44889;outline-offset:3px}.b:active{transform:translateY(3px)}.b:disabled{opacity:.55}.card{background:white;border:4px solid var(--ink);border-radius:25px;padding:20px;max-width:1000px;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;width:min(1100px,100%)}.choice{background:white;min-height:110px}.pill{background:white;border:3px solid var(--ink);border-radius:24px;padding:7px 12px;font-weight:700}.big{font-size:clamp(22px,3.4vw,42px)}aside{position:fixed;right:15px;top:80px;max-width:min(420px,90vw);background:white;border:4px solid var(--ink);border-radius:18px;padding:15px;z-index:20;box-shadow:0 6px 0 var(--ink)}aside[hidden]{display:none}.dots{display:flex;gap:7px;flex-wrap:wrap}.dot{border:3px solid var(--ink);border-radius:50%;width:44px;height:44px;background:white;cursor:pointer;font-size:22px}.on{background:#ffc93c}.feedback{font-size:clamp(20px,3vw,34px);min-height:42px}.correct{background:#c8f3cf!important}.wrong{background:#ffc6c6!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header><h1>⛵ Vocabulary Voyage</h1><span class="pill">⭐ <b id="stars">0</b></span><button class="b" id="teamA">🥕 0</button><button class="b" id="teamB">🌰 0</button><button class="b" id="mute">🔊</button><button class="b" id="teach">🧑‍🏫</button></header><aside id="panel" hidden><h2>Teacher Panel</h2><p id="hint"></p><p>🎲 Pick a student: <input id="count" type="number" min="2" max="60" value="20" style="width:65px"><button class="b" id="pick">Go</button> <b id="picked"></b></p><button class="b" id="reset">Reset</button> <button class="b" id="full">⛶ Full screen</button></aside><main id="main"></main><footer><button class="b" id="prev">◀</button><div class="dots" id="dots"></div><button class="b" id="next">▶</button></footer><script>const QS=[{"q": "What is a gale?", "o": ["A strong wind", "A small boat", "A safe port", "A type of food"], "a": 0, "why": "A gale is a very strong wind."}, {"q": "What is the hull of a ship?", "o": ["A passenger ticket", "The main body of the ship", "A meal", "A sail color"], "a": 1, "why": "The hull is the ship\u2019s main body."}, {"q": "What is a merchant ship?", "o": ["A ship for trade or transport", "A tiny fishing pond", "A rescue helicopter", "A lighthouse"], "a": 0, "why": "Merchant ships carry goods or passengers for business."}, {"q": "What does ominous mean?", "o": ["Cheerful", "Suggesting trouble", "Very quiet", "Extremely tiny"], "a": 1, "why": "Ominous suggests that something bad may happen."}, {"q": "Which are provisions?", "o": ["Food supplies", "Storm clouds", "Ship ropes only", "Travel tickets only"], "a": 0, "why": "Provisions are supplies such as food."}, {"q": "What does route mean?", "o": ["A ship\u2019s bell", "The path of a journey", "A type of wave", "A wooden floor"], "a": 1, "why": "A route is a path taken during travel."}, {"q": "What does destination mean?", "o": ["A starting point", "The place one travels to", "A strong wind", "A family member"], "a": 1, "why": "Destination means the place someone is going."}, {"q": "What is a sandbank?", "o": ["Shallow sand that can trap a ship", "A ship\u2019s cabin", "A heavy rainstorm", "A supply box"], "a": 0, "why": "A sandbank is a raised area of sand in shallow water."}, {"q": "Which detail makes the story historical fiction?", "o": ["The story is set during an 1868 voyage", "All characters are superheroes", "The ship flies", "The story takes place in the future"], "a": 0, "why": "The voyage is set in a historical period."}, {"q": "Who tells the story?", "o": ["Nanny Amelia", "Lisbeth", "The captain", "A sailor"], "a": 1, "why": "Lisbeth narrates the story."}];const WORDS=[["gale", "a very strong wind"], ["hull", "the main body of a ship"], ["merchant ship", "a ship that carries goods or passengers for business"], ["ominous", "suggesting that something bad may happen"], ["provisions", "supplies, especially food"], ["route", "the path followed on a journey"], ["anticipation", "a feeling of excited expectation"], ["destination", "the place someone is traveling to"], ["sandbank", "an area of sand in shallow water"]];const $=x=>document.querySelector(x);let stage=0,stars=0,team=[0,0],mute=false,correct=0,attempted=new Set(),completed=new Set();const stages=['Ship Adventure','Word Wizard','Historical Fiction Detective','Story Detectives','Yes or No'];const hints=['4 min: discuss life aboard an 1868 ship.','6 min: tap each word; listen, say and explain.','5 min: distinguish historical facts and fiction.','8 min: choose numbers, answer text-based questions.','5 min: judge statements; reflect and finish.'];function say(t){if(mute||!speechSynthesis)return;speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='en-US';a.rate=.83;speechSynthesis.speak(a)}function star(){stars++;$('#stars').textContent=stars}function show(s){stage=Math.max(0,Math.min(4,s));$('#hint').textContent=hints[stage];$('#dots').innerHTML=stages.map((x,i)=>`<button class="dot ${i===stage?'on':''}" onclick="show(${i})" title="${x}">${completed.has(i)?'✓':i+1}</button>`).join('');if(stage===0)warm();if(stage===1)wizard();if(stage===2)detect();if(stage===3)quiz();if(stage===4)yesno()}function complete(){completed.add(stage);star();$('#dots').children[stage].textContent='✓'}function warm(){let opts=['🌊 Ocean waves','⛵ Sailing ship','🌩️ Dangerous storm','🧭 Journey route'];$('#main').innerHTML='<h2>What might a voyage in 1868 be like?</h2><div class="grid">'+opts.map((o,i)=>`<button class="b choice" data-i="${i}">${o}</button>`).join('')+'</div><p class="big" id="msg">Tap a picture. Describe it!</p>';let seen=new Set();document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{seen.add(+b.dataset.i);b.classList.add('correct');$('#msg').textContent='Tell your partner: I predict that...';say(b.textContent);if(seen.size===4)complete()})}function wizard(){let idx=0,seen=new Set();$('#main').innerHTML='<h2>🧙 Word Wizard</h2><div class="card"><div id="word" class="big"></div><p id="meaning" class="big"></p></div><div><button class="b" id="backword">◀</button> <button class="b" id="listen">🔊 Listen • Say • Explain</button> <button class="b" id="nextword">▶</button></div><p id="progress"></p>';function render(){$('#word').textContent=WORDS[idx][0];$('#meaning').textContent=WORDS[idx][1];$('#progress').textContent=WORDS.map((_,i)=>seen.has(i)?'⭐':'⚪').join(' ')}$('#backword').onclick=()=>{idx=(idx+WORDS.length-1)%WORDS.length;render()};$('#nextword').onclick=()=>{idx=(idx+1)%WORDS.length;render()};$('#listen').onclick=()=>{say(WORDS[idx][0]+'. '+WORDS[idx][1]);if(!seen.has(idx)){seen.add(idx);star()}if(seen.size===WORDS.length)complete();render()};render()}function detect(){const items=[['The story takes place in 1868.','Historical setting'],['Lisbeth tells the story.','Narrator'],['A powerful storm damages the ship.','Key event'],['Staying strong is an important lesson.','Theme']];let i=0;$('#main').innerHTML='<h2>🔎 Historical Fiction Detective</h2><div class="card"><p id="fact" class="big"></p><div class="grid" id="opts"></div><p class="feedback" id="feedback"></p></div>';function draw(){if(i>=items.length){$('#fact').textContent='Excellent, detectives!';$('#opts').innerHTML='';complete();return}$('#fact').textContent=items[i][0];$('#opts').innerHTML=['Historical setting','Narrator','Key event','Theme'].map(v=>`<button class="b choice">${v}</button>`).join('');document.querySelectorAll('#opts button').forEach(b=>b.onclick=()=>{if(b.textContent===items[i][1]){b.classList.add('correct');$('#feedback').textContent='Correct!';star();i++;setTimeout(draw,550)}else{$('#feedback').textContent='Try again!';b.classList.add('wrong')}})}draw()}function quiz(){let selected=null,seen=new Set();$('#main').innerHTML='<h2>🔢 Story Detectives — Pick a Number!</h2><div class="grid" id="numbers"></div><div class="card" id="qa">Read the story, then choose a number.</div>';function draw(){$('#numbers').innerHTML=QS.slice(0,8).map((q,i)=>`<button class="b" data-n="${i}" ${seen.has(i)?'disabled':''}>${seen.has(i)?'✓':i+1}</button>`).join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{let i=+b.dataset.n,q=QS[i];$('#qa').innerHTML=`<p class="big">${q.q}</p><button class="b" id="read">🔊</button><div class="grid">${q.o.map((x,j)=>`<button class="b choice" data-a="${j}">${'ABCD'[j]}. ${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`;$('#read').onclick=()=>say(q.q);say(q.q);document.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>{if(+c.dataset.a===q.a){c.classList.add('correct');$('#feedback').textContent='Correct! '+q.why;star();seen.add(i);draw();if(seen.size===8)complete()}else{c.classList.add('wrong');$('#feedback').textContent='Try again. Read carefully!'}})})}draw()}function yesno(){let items=[['Lisbeth narrates the story.',true],['The ship travels from New York to Liverpool.',false],['The Brazil provides food supplies.',true],['The Isaac Webb gets stuck on a sandbank.',true],['The story takes place in the future.',false],['The theme can be about staying strong.',true]];let i=0;$('#main').innerHTML='<h2>👍 Yes or No?</h2><div class="card"><p class="big" id="statement"></p><button class="b" id="yes">✅ Yes</button> <button class="b" id="no">❌ No</button> <button class="b" id="repeat">🔊</button><p class="feedback" id="feedback"></p></div><div class="card"><p>Self-assessment</p><button class="b" id="confident">👍 I can do it!</button> <button class="b" id="practice">😊 More practice</button><p id="result"></p></div>';function draw(){if(i===items.length){$('#statement').textContent='🎉 Voyage complete!';$('#result').textContent=`Stars: ${stars} • Team Carrots: ${team[0]} • Team Acorns: ${team[1]}`;complete();return}$('#statement').textContent=items[i][0];say(items[i][0])}function answer(a){if(i>=items.length)return;if(a===items[i][1]){star();$('#feedback').textContent='Correct!';i++;setTimeout(draw,550)}else $('#feedback').textContent='Try again!'}$('#yes').onclick=()=>answer(true);$('#no').onclick=()=>answer(false);$('#repeat').onclick=()=>i<items.length&&say(items[i][0]);$('#confident').onclick=()=>$('#result').textContent='Great! You are ready for the next lesson.';$('#practice').onclick=()=>$('#result').textContent='Keep practicing the vocabulary and story details.';draw()}$('#prev').onclick=()=>show(stage-1);$('#next').onclick=()=>show(stage+1);$('#teach').onclick=()=>$('#panel').hidden=!$('#panel').hidden;$('#mute').onclick=()=>{mute=!mute;$('#mute').textContent=mute?'🔇':'🔊';speechSynthesis.cancel()};['teamA','teamB'].forEach((id,i)=>$('#'+id).onclick=()=>{$('#'+id).textContent=(i?'🌰 ':'🥕 ')+ ++team[i]});$('#pick').onclick=()=>$('#picked').textContent=1+Math.floor(Math.random()*(+$('#count').value||20));$('#reset').onclick=()=>{stars=0;team=[0,0];completed.clear();$('#stars').textContent=0;$('#teamA').textContent='🥕 0';$('#teamB').textContent='🌰 0';show(0)};$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();show(0);</script></body></html>
